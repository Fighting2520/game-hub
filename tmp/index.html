<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bee Game</title>
    <audio id="bgMusic" loop>
        <source src="./bgm.mp3" type="audio/mpeg">
    </audio>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
        }

        #game-canvas {
            background-color: #74b9ff;
            border: 4px solid #2d3436;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        #start-screen,
        #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 6px;
            color: white;
        }

        #game-over {
            display: none;
        }

        h1 {
            color: #fdcb6e;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        button {
            background: linear-gradient(to bottom, #fdcb6e, #f0b64d);
            border: none;
            border-radius: 25px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #2d3436;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .score-display {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>
    <div id="game-container">
        <canvas id="game-canvas" width="320" height="480"></canvas>
        <div class="score-display">Score: <span id="score">0</span></div>
        <!-- 音乐控制按钮 -->
        <button id="muteBtn"
            style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer;">🔊</button>

        <div id="start-screen">
            <h1>Flappy Bee</h1>
            <p>Click or press Space to start</p>
            <p style="font-size: 12px; color: #ddd; margin-top: 10px;">(Game includes sound effects and background
                music)</p>
            <button onclick="startGame()">Start Game</button>
        </div>

        <div id="game-over">
            <h1>Game Over!</h1>
            <p>Final Score: <span id="final-score">0</span></p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        // 获取音频元素
        const bgMusic = document.getElementById('bgMusic');
        bgMusic.volume = 0.3; // 设置背景音乐音量（30%）
        // 游戏变量
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        let gameRunning = false;
        let score = 0;

        // 蜜蜂对象
        const bee = {
            x: 50,
            y: canvas.height / 2,
            radius: 15,
            gravity: 0.5,
            velocity: 0,
            jump: -8,
            color: '#fdcb6e',

            draw() {
                // 1. 身体（椭圆，分成黄黑相间条纹）
                ctx.save();
                ctx.translate(this.x, this.y);

                // 黄色椭圆底色
                ctx.beginPath();
                ctx.ellipse(0, 0, this.radius * 1.2, this.radius, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#FFD93B'; // 鲜亮黄色
                ctx.fill();
                ctx.closePath();

                // 黑色条纹（3条）
                ctx.fillStyle = '#333';
                for (let i = -0.6; i <= 0.6; i += 0.6) {
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.radius * 1.2, this.radius, 0, Math.PI * (i), Math.PI * (i + 0.3));
                    ctx.fill();
                    ctx.closePath();
                }

                // 2. 翅膀（两个半透明椭圆，位置更高更大）
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.ellipse(-this.radius * 0.6, -this.radius * 1.2, this.radius * 0.9, this.radius * 0.5, -Math.PI / 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();

                ctx.beginPath();
                ctx.ellipse(this.radius * 0.6, -this.radius * 1.2, this.radius * 0.9, this.radius * 0.5, Math.PI / 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();

                // 3. 头部（小黑球）
                ctx.beginPath();
                ctx.arc(this.radius * 1.3, -this.radius * 0.2, this.radius * 0.6, 0, Math.PI * 2);
                ctx.fillStyle = '#333';
                ctx.fill();
                ctx.closePath();

                // 4. 眼睛（白色大圆+黑色瞳孔）
                ctx.beginPath();
                ctx.arc(this.radius * 1.5, -this.radius * 0.3, this.radius * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.closePath();

                ctx.beginPath();
                ctx.arc(this.radius * 1.5, -this.radius * 0.3, this.radius * 0.1, 0, Math.PI * 2);
                ctx.fillStyle = '#000';
                ctx.fill();
                ctx.closePath();

                // 5. 触角
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.radius * 1.3, -this.radius * 0.6);
                ctx.quadraticCurveTo(this.radius * 1.8, -this.radius * 1.2, this.radius * 2.0, -this.radius * 1.5);
                ctx.stroke();
                ctx.closePath();

                ctx.beginPath();
                ctx.moveTo(this.radius * 1.3, -this.radius * 0.6);
                ctx.quadraticCurveTo(this.radius * 1.0, -this.radius * 1.2, this.radius * 0.8, -this.radius * 1.5);
                ctx.stroke();
                ctx.closePath();

                ctx.restore();
            },

            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                // 防止蜜蜂飞出画布顶部
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }

                // 检查是否掉落到地面
                if (this.y + this.radius > canvas.height) {
                    gameOver();
                }
            },

            flap() {
                this.velocity = this.jump;
                playJumpSound(); // 添加这行
            }
        };

        // 管道对象
        const pipes = {
            position: [],
            gap: 150,
            maxYPos: 250,
            width: 50,
            speed: 2,
            color: '#00b894',

            draw() {
                for (let i = 0; i < this.position.length; i++) {
                    const pipe = this.position[i];

                    // 上管道
                    ctx.fillStyle = this.color;
                    ctx.fillRect(pipe.x, 0, this.width, pipe.y);

                    // 下管道
                    const bottomPipeY = pipe.y + this.gap;
                    ctx.fillRect(pipe.x, bottomPipeY, this.width, canvas.height - bottomPipeY);

                    // 管道边框
                    ctx.strokeStyle = '#2d3436';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(pipe.x, 0, this.width, pipe.y);
                    ctx.strokeRect(pipe.x, bottomPipeY, this.width, canvas.height - bottomPipeY);
                }
            },

            update() {
                if (gameRunning) {
                    // 每150帧生成新管道
                    if (frames % 150 === 0) {
                        this.position.push({
                            x: canvas.width,
                            y: Math.floor(Math.random() * this.maxYPos) + 50
                        });
                    }

                    for (let i = 0; i < this.position.length; i++) {
                        const pipe = this.position[i];

                        // 移动管道
                        pipe.x -= this.speed;

                        // 检查碰撞
                        this.checkCollision(pipe);

                        // 检查得分
                        if (pipe.x + this.width === bee.x) {
                            score++;
                            document.getElementById('score').textContent = score;
                            playScoreSound(); // 添加这行
                        }

                        // 移除屏幕外的管道
                        if (pipe.x + this.width < 0) {
                            this.position.shift();
                        }
                    }
                }
            },

            checkCollision(pipe) {
                // 检查与上管道的碰撞
                if (bee.x + bee.radius > pipe.x &&
                    bee.x - bee.radius < pipe.x + this.width &&
                    bee.y - bee.radius < pipe.y) {
                    gameOver();
                }

                // 检查与下管道的碰撞
                const bottomPipeY = pipe.y + this.gap;
                if (bee.x + bee.radius > pipe.x &&
                    bee.x - bee.radius < pipe.x + this.width &&
                    bee.y + bee.radius > bottomPipeY) {
                    gameOver();
                }
            },

            reset() {
                this.position = [];
            }
        };

        let frames = 0;
        let gameLoop;

        // 游戏函数
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-over').style.display = 'none';
            gameRunning = true;
            score = 0;
            document.getElementById('score').textContent = '0';

            bee.y = canvas.height / 2;
            bee.velocity = 0;
            pipes.reset();

            if (gameLoop) {
                clearInterval(gameLoop);
            }

            startBackgroundMusic(); // 添加这行：开始播放背景音乐
            gameLoop = setInterval(update, 1000 / 60); // 60 FPS
        }

        function update() {
            if (!gameRunning) return;

            frames++;

            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制背景
            ctx.fillStyle = '#74b9ff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 绘制地面
            ctx.fillStyle = '#00b894';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

            // 更新和绘制对象
            pipes.update();
            pipes.draw();

            bee.update();
            bee.draw();
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            stopBackgroundMusic(); // 停止背景音乐
            playHitSound(); // 添加碰撞音效

            document.getElementById('final-score').textContent = score;
            document.getElementById('game-over').style.display = 'flex';
        }

        function restartGame() {
            startGame();
        }

        // 事件监听
        canvas.addEventListener('click', function () {
            if (gameRunning) {
                bee.flap();
            }
        });

        document.addEventListener('keydown', function (e) {
            if (e.code === 'Space') {
                if (gameRunning) {
                    bee.flap();
                } else if (document.getElementById('start-screen').style.display !== 'none') {
                    startGame();
                } else {
                    restartGame();
                }
                e.preventDefault(); // 防止空格键滚动页面
            }
        });

        // 初始绘制
        ctx.fillStyle = '#74b9ff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        bee.draw();

        // 音频上下文（兼容不同浏览器）
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        // 简单的音效生成函数
        function createBuzzerSound(frequency, duration) {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sawtooth';
            oscillator.frequency.value = frequency;
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        // 播放跳跃音效（蜜蜂嗡嗡声）
        function playJumpSound() {
            createBuzzerSound(400, 0.2); // 较高的嗡嗡声
        }

        // 播放碰撞音效
        function playHitSound() {
            createBuzzerSound(150, 0.5); // 低沉的嗡嗡声
        }

        // 播放得分音效
        function playScoreSound() {
            createBuzzerSound(600, 0.1); // 短促的高音
            setTimeout(() => createBuzzerSound(800, 0.1), 100); // 第二个更高音
        }

        // 在游戏开始时播放背景音乐
        function startBackgroundMusic() {
            // 确保音乐从头开始播放
            bgMusic.currentTime = 0;
            bgMusic.play().catch(error => {
                console.log('需要用户交互后才能播放音乐:', error);
            });
        }

        function stopBackgroundMusic() {
            bgMusic.pause();
        }

        // 解决浏览器自动播放限制：在用户第一次交互时预加载
        function initAudio() {
            // 尝试播放并立即暂停，让音频系统准备好
            bgMusic.play().then(() => {
                bgMusic.pause();
            }).catch(error => {
                // 这是正常的，需要用户交互
            });
        }

        // 页面加载时初始化音频
        initAudio();
        // 音乐静音控制
        const muteBtn = document.getElementById('muteBtn');
        let isMuted = false;

        muteBtn.addEventListener('click', function () {
            isMuted = !isMuted;
            bgMusic.muted = isMuted;
            muteBtn.textContent = isMuted ? '🔇' : '🔊';

            // 存储用户偏好
            localStorage.setItem('gameMuted', isMuted);
        });

        // 读取用户之前的设置
        window.addEventListener('load', function () {
            const savedMute = localStorage.getItem('gameMuted');
            if (savedMute === 'true') {
                isMuted = true;
                bgMusic.muted = true;
                muteBtn.textContent = '🔇';
            }
        });
    </script>
</body>

</html>
