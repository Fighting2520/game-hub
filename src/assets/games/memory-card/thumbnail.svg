<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <!-- 卡牌正面渐变 -->
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <!-- 卡牌背面渐变 -->
    <linearGradient id="cardBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    
    <!-- 匹配卡牌渐变 -->
    <linearGradient id="cardMatched" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45a049;stop-opacity:1" />
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="200" height="150" fill="url(#bgGradient)"/>
  
  <!-- 游戏板背景 -->
  <rect x="20" y="15" width="160" height="120" rx="15" fill="rgba(255, 255, 255, 0.1)" 
        stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
  
  <!-- 4x4 卡牌网格 -->
  <!-- 第一行 -->
  <!-- 卡牌1 - 正面 -->
  <rect x="30" y="25" width="25" height="25" rx="5" fill="url(#cardFront)" 
        stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
  <text x="42.5" y="42" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="16" fill="white" opacity="0.8">❓</text>
  
  <!-- 卡牌2 - 翻开显示苹果 -->
  <rect x="60" y="25" width="25" height="25" rx="5" fill="url(#cardBack)" 
        stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
  <text x="72.5" y="42" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" fill="white">🍎</text>
  
  <!-- 卡牌3 - 正面 -->
  <rect x="90" y="25" width="25" height="25" rx="5" fill="url(#cardFront)" 
        stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
  <text x="102.5" y="42" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="16" fill="white" opacity="0.8">❓</text>
  
  <!-- 卡牌4 - 翻开显示香蕉 -->
  <rect x="120" y="25" width="25" height="25" rx="5" fill="url(#cardBack)" 
        stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
  <text x="132.5" y="42" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" fill="white">🍌</text>
  
  <!-- 第二行 -->
  <!-- 卡牌5 - 翻开显示葡萄 -->
  <rect x="30" y="55" width="25" height="25" rx="5" fill="url(#cardBack)" 
        stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
  <text x="42.5" y="72" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" fill="white">🍇</text>
  
  <!-- 卡牌6 - 正面 -->
  <rect x="60" y="55" width="25" height="25" rx="5" fill="url(#cardFront)" 
        stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
  <text x="72.5" y="72" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="16" fill="white" opacity="0.8">❓</text>
  
  <!-- 卡牌7 - 已匹配的苹果 -->
  <rect x="90" y="55" width="25" height="25" rx="5" fill="url(#cardMatched)" 
        stroke="rgba(76, 175, 80, 0.8)" stroke-width="2"/>
  <text x="102.5" y="72" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" fill="white" filter="url(#glow)">🍎</text>
  
  <!-- 卡牌8 - 正面 -->
  <rect x="120" y="55" width="25" height="25" rx="5" fill="url(#cardFront)" 
        stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
  <text x="132.5" y="72" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="16" fill="white" opacity="0.8">❓</text>
  
  <!-- 第三行 -->
  <!-- 卡牌9 - 正面 -->
  <rect x="30" y="85" width="25" height="25" rx="5" fill="url(#cardFront)" 
        stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
  <text x="42.5" y="102" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="16" fill="white" opacity="0.8">❓</text>
  
  <!-- 卡牌10 - 翻开显示橙子 -->
  <rect x="60" y="85" width="25" height="25" rx="5" fill="url(#cardBack)" 
        stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
  <text x="72.5" y="102" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" fill="white">🍊</text>
  
  <!-- 卡牌11 - 正面 -->
  <rect x="90" y="85" width="25" height="25" rx="5" fill="url(#cardFront)" 
        stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
  <text x="102.5" y="102" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="16" fill="white" opacity="0.8">❓</text>
  
  <!-- 卡牌12 - 已匹配的苹果 -->
  <rect x="120" y="85" width="25" height="25" rx="5" fill="url(#cardMatched)" 
        stroke="rgba(76, 175, 80, 0.8)" stroke-width="2"/>
  <text x="132.5" y="102" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" fill="white" filter="url(#glow)">🍎</text>
  
  <!-- 第四行 -->
  <!-- 卡牌13 - 翻开显示草莓 -->
  <rect x="30" y="115" width="25" height="25" rx="5" fill="url(#cardBack)" 
        stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
  <text x="42.5" y="132" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" fill="white">🍓</text>
  
  <!-- 卡牌14 - 正面 -->
  <rect x="60" y="115" width="25" height="25" rx="5" fill="url(#cardFront)" 
        stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
  <text x="72.5" y="132" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="16" fill="white" opacity="0.8">❓</text>
  
  <!-- 卡牌15 - 翻开显示香蕉 -->
  <rect x="90" y="115" width="25" height="25" rx="5" fill="url(#cardBack)" 
        stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
  <text x="102.5" y="132" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" fill="white">🍌</text>
  
  <!-- 卡牌16 - 正面 -->
  <rect x="120" y="115" width="25" height="25" rx="5" fill="url(#cardFront)" 
        stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
  <text x="132.5" y="132" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="16" fill="white" opacity="0.8">❓</text>
  
  <!-- 连接线显示匹配 -->
  <path d="M 102.5 67.5 Q 111 67.5 111 92.5 Q 111 97.5 132.5 97.5" 
        stroke="#4CAF50" stroke-width="2" fill="none" opacity="0.8" stroke-dasharray="3,2">
    <animate attributeName="stroke-dashoffset" values="0;5" dur="1s" repeatCount="indefinite"/>
  </path>
  
  <!-- 右侧统计信息 -->
  <g transform="translate(155, 25)">
    <!-- 翻牌次数 -->
    <rect x="0" y="0" width="20" height="12" rx="3" fill="rgba(33, 150, 243, 0.3)"/>
    <text x="10" y="8" text-anchor="middle" font-family="Arial, sans-serif" 
          font-size="7" font-weight="bold" fill="white">12次</text>
    
    <!-- 配对数 -->
    <rect x="0" y="15" width="20" height="12" rx="3" fill="rgba(76, 175, 80, 0.3)"/>
    <text x="10" y="23" text-anchor="middle" font-family="Arial, sans-serif" 
          font-size="7" font-weight="bold" fill="white">1/8</text>
    
    <!-- 用时 -->
    <rect x="0" y="30" width="20" height="12" rx="3" fill="rgba(255, 193, 7, 0.3)"/>
    <text x="10" y="38" text-anchor="middle" font-family="Arial, sans-serif" 
          font-size="7" font-weight="bold" fill="white">1:23</text>
    
    <!-- 得分 -->
    <rect x="0" y="45" width="20" height="12" rx="3" fill="rgba(156, 39, 176, 0.3)"/>
    <text x="10" y="53" text-anchor="middle" font-family="Arial, sans-serif" 
          font-size="7" font-weight="bold" fill="white">850</text>
  </g>
  
  <!-- 记忆力图标 -->
  <g transform="translate(15, 20)" opacity="0.6">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" fill="#FFD700">🧠</text>
    
    <!-- 思考波纹 -->
    <circle cx="8" cy="-8" r="3" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.5">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="8" cy="-8" r="5" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="5;8;5" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 翻牌动画指示 -->
  <g transform="translate(72.5, 20)" opacity="0.8">
    <path d="M 0 0 L -3 -3 L -1 -3 L -1 -6 L 1 -6 L 1 -3 L 3 -3 Z" 
          fill="#FFD700">
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0;0,-2;0,0" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 星星装饰 -->
  <g opacity="0.7">
    <text x="25" y="15" font-family="Arial, sans-serif" font-size="8" fill="#FFD700">⭐</text>
    <text x="170" y="20" font-family="Arial, sans-serif" font-size="6" fill="#FFD700">✨</text>
    <text x="25" y="145" font-family="Arial, sans-serif" font-size="6" fill="#FFD700">💫</text>
    <text x="165" y="140" font-family="Arial, sans-serif" font-size="8" fill="#FFD700">⭐</text>
  </g>
  
  <!-- 进度条 -->
  <g transform="translate(30, 145)">
    <rect x="0" y="0" width="90" height="4" rx="2" fill="rgba(255, 255, 255, 0.2)"/>
    <rect x="0" y="0" width="18" height="4" rx="2" fill="#4CAF50"/>
    <text x="95" y="3" font-family="Arial, sans-serif" font-size="6" fill="white" opacity="0.8">20%</text>
  </g>
  
  <!-- 游戏标题 -->
  <text x="100" y="10" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="12" font-weight="bold" fill="white">记忆翻牌</text>
</svg>