  <rect x="105" y="45" width="18" height="8" fill="#00b894" stroke="#2d3436" stroke-width="0.5"/>
  <rect x="125" y="45" width="18" height="8" fill="#00b894" stroke="#2d3436" stroke-width="0.5"/>
  <rect x="145" y="45" width="18" height="8" fill="#00b894" stroke="#2d3436" stroke-width="0.5"/>
  <rect x="165" y="45" width="12" height="8" fill="#00b894" stroke="#2d3436" stroke-width="0.5"/>
  
