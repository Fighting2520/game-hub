  <rect x="145" y="65" width="18" height="8" fill="#a29bfe" stroke="#2d3436" stroke-width="0.5"/>
  <rect x="165" y="65" width="12" height="8" fill="#a29bfe" stroke="#2d3436" stroke-width="0.5"/>
  
  <!-- 挡板 -->
  <rect x="85" y="125" width="30" height="6" fill="#55efc4" stroke="#2d3436" stroke-width="1" rx="3"/>
  
  <!-- 球 -->
  <circle cx="100" cy="110" r="4" fill="white" stroke="#636e72" stroke-width="1"/>
  
  <!-- 球的运动轨迹线 -->
  <path d="M 100 110 L 120 90 L 140 70" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none" stroke-dasharray="2,2"/>
  
  <!-- 标题 -->
  <text x="100" y="15" text-anchor="middle" fill="#00b894" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🧱 打砖块</text>
  
  <!-- 分数显示 -->
  <text x="100" y="152" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10">Score: 1240</text>
