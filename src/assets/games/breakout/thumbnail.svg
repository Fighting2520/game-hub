  <rect x="65" y="35" width="18" height="8" fill="#fdcb6e" stroke="#2d3436" stroke-width="0.5"/>
  <rect x="85" y="35" width="18" height="8" fill="#fdcb6e" stroke="#2d3436" stroke-width="0.5"/>
  <rect x="105" y="35" width="18" height="8" fill="#fdcb6e" stroke="#2d3436" stroke-width="0.5"/>
  <rect x="125" y="35" width="18" height="8" fill="#fdcb6e" stroke="#2d3436" stroke-width="0.5"/>
  <rect x="145" y="35" width="18" height="8" fill="#fdcb6e" stroke="#2d3436" stroke-width="0.5"/>
  <rect x="165" y="35" width="12" height="8" fill="#fdcb6e" stroke="#2d3436" stroke-width="0.5"/>
  
  <!-- 第三行 - 绿色 -->
  <rect x="25" y="45" width="18" height="8" fill="#00b894" stroke="#2d3436" stroke-width="0.5"/>
