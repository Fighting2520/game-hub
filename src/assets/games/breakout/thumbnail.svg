  <rect x="145" y="55" width="18" height="8" fill="#74b9ff" stroke="#2d3436" stroke-width="0.5"/>
  <rect x="165" y="55" width="12" height="8" fill="#74b9ff" stroke="#2d3436" stroke-width="0.5"/>
  
  <!-- 第五行 - 紫色 -->
