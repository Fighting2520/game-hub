<svg width="200" height="160" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#74b9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pipeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b894;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00a085;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 天空背景 -->
  <rect width="200" height="160" fill="url(#skyGradient)"/>
  
  <!-- 云朵 -->
  <ellipse cx="30" cy="25" rx="8" ry="5" fill="rgba(255,255,255,0.6)"/>
  <ellipse cx="35" cy="25" rx="10" ry="6" fill="rgba(255,255,255,0.6)"/>
  <ellipse cx="40" cy="25" rx="8" ry="5" fill="rgba(255,255,255,0.6)"/>
  
  <ellipse cx="150" cy="35" rx="6" ry="4" fill="rgba(255,255,255,0.4)"/>
  <ellipse cx="155" cy="35" rx="8" ry="5" fill="rgba(255,255,255,0.4)"/>
  <ellipse cx="160" cy="35" rx="6" ry="4" fill="rgba(255,255,255,0.4)"/>
  
  <!-- 管道 -->
  <rect x="140" y="0" width="25" height="50" fill="url(#pipeGradient)" stroke="#2d3436" stroke-width="1"/>
  <rect x="138" y="45" width="29" height="8" fill="#00b894" stroke="#2d3436" stroke-width="1"/>
  
  <rect x="140" y="110" width="25" height="50" fill="url(#pipeGradient)" stroke="#2d3436" stroke-width="1"/>
  <rect x="138" y="107" width="29" height="8" fill="#00b894" stroke="#2d3436" stroke-width="1"/>
  
  <!-- 蜜蜂身体 -->
  <g transform="translate(80,80)">
    <!-- 身体椭圆 -->
    <ellipse cx="0" cy="0" rx="18" ry="12" fill="#FFD93B"/>
    
    <!-- 黑色条纹 -->
    <ellipse cx="-6" cy="0" rx="3" ry="12" fill="#333"/>
    <ellipse cx="6" cy="0" rx="3" ry="12" fill="#333"/>
    
    <!-- 翅膀 -->
    <ellipse cx="-8" cy="-18" rx="12" ry="6" fill="rgba(255,255,255,0.7)" transform="rotate(-15)"/>
    <ellipse cx="8" cy="-18" rx="12" ry="6" fill="rgba(255,255,255,0.7)" transform="rotate(15)"/>
    
    <!-- 头部 -->
    <circle cx="20" cy="-3" r="9" fill="#333"/>
    
    <!-- 眼睛 -->
    <circle cx="23" cy="-5" r="4" fill="#fff"/>
    <circle cx="23" cy="-5" r="2" fill="#000"/>
    
    <!-- 触角 -->
    <path d="M 20 -10 Q 25 -18 28 -22" stroke="#333" stroke-width="2" fill="none"/>
    <path d="M 20 -10 Q 15 -18 12 -22" stroke="#333" stroke-width="2" fill="none"/>
    <circle cx="28" cy="-22" r="1.5" fill="#333"/>
    <circle cx="12" cy="-22" r="1.5" fill="#333"/>
  </g>
  
  <!-- 地面 -->
  <rect x="0" y="140" width="200" height="20" fill="#00b894"/>
  
  <!-- 标题 -->
  <text x="100" y="25" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🐝 Flappy Bee</text>
  
  <!-- 分数显示 -->
  <text x="100" y="150" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11">Score: 12</text>
</svg>