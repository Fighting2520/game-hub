<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="floorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DEB887;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2B48C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wallGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#654321;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CD853F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0522D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="completedBoxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#32CD32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="200" height="200" fill="url(#bgGradient)" rx="20"/>
  
  <!-- 游戏标题区域 -->
  <rect x="20" y="20" width="160" height="40" fill="rgba(255,255,255,0.2)" rx="10" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  
  <!-- 推箱子图标 -->
  <rect x="35" y="30" width="20" height="20" fill="url(#boxGradient)" rx="3" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
  <text x="45" y="42" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">📦</text>
  
  <!-- 标题文字 -->
  <text x="65" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">推箱子</text>
  <text x="65" y="48" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.8)">SOKOBAN</text>
  
  <!-- 关卡显示 -->
  <rect x="120" y="28" width="50" height="24" fill="rgba(0,0,0,0.3)" rx="4"/>
  <text x="145" y="42" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#00ff00" text-anchor="middle">关卡 1</text>
  
  <!-- 游戏场景 -->
  <g transform="translate(30, 80)">
    <!-- 游戏区域背景 -->
    <rect x="0" y="0" width="140" height="140" fill="rgba(0,0,0,0.3)" rx="8" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    
    <!-- 创建一个简单的推箱子关卡场景 -->
    <!-- 地板 -->
    <g fill="url(#floorGradient)" stroke="#D2B48C" stroke-width="0.5">
      <!-- 第一行 -->
      <rect x="20" y="20" width="16" height="16"/>
      <rect x="36" y="20" width="16" height="16"/>
      <rect x="52" y="20" width="16" height="16"/>
      <rect x="68" y="20" width="16" height="16"/>
      <rect x="84" y="20" width="16" height="16"/>
      <rect x="100" y="20" width="16" height="16"/>
      
      <!-- 第二行 -->
      <rect x="20" y="36" width="16" height="16"/>
      <rect x="36" y="36" width="16" height="16"/>
      <rect x="52" y="36" width="16" height="16"/>
      <rect x="68" y="36" width="16" height="16"/>
      <rect x="84" y="36" width="16" height="16"/>
      <rect x="100" y="36" width="16" height="16"/>
      
      <!-- 第三行 -->
      <rect x="20" y="52" width="16" height="16"/>
      <rect x="36" y="52" width="16" height="16"/>
      <rect x="52" y="52" width="16" height="16"/>
      <rect x="68" y="52" width="16" height="16"/>
      <rect x="84" y="52" width="16" height="16"/>
      <rect x="100" y="52" width="16" height="16"/>
      
      <!-- 第四行 -->
      <rect x="20" y="68" width="16" height="16"/>
      <rect x="36" y="68" width="16" height="16"/>
      <rect x="52" y="68" width="16" height="16"/>
      <rect x="68" y="68" width="16" height="16"/>
      <rect x="84" y="68" width="16" height="16"/>
      <rect x="100" y="68" width="16" height="16"/>
      
      <!-- 第五行 -->
      <rect x="20" y="84" width="16" height="16"/>
      <rect x="36" y="84" width="16" height="16"/>
      <rect x="52" y="84" width="16" height="16"/>
      <rect x="68" y="84" width="16" height="16"/>
      <rect x="84" y="84" width="16" height="16"/>
      <rect x="100" y="84" width="16" height="16"/>
      
      <!-- 第六行 -->
      <rect x="20" y="100" width="16" height="16"/>
      <rect x="36" y="100" width="16" height="16"/>
      <rect x="52" y="100" width="16" height="16"/>
      <rect x="68" y="100" width="16" height="16"/>
      <rect x="84" y="100" width="16" height="16"/>
      <rect x="100" y="100" width="16" height="16"/>
    </g>
    
    <!-- 墙壁 -->
    <g fill="url(#wallGradient)" stroke="#654321" stroke-width="1">
      <!-- 外墙 -->
      <rect x="4" y="4" width="16" height="16"/>
      <rect x="20" y="4" width="16" height="16"/>
      <rect x="36" y="4" width="16" height="16"/>
      <rect x="52" y="4" width="16" height="16"/>
      <rect x="68" y="4" width="16" height="16"/>
      <rect x="84" y="4" width="16" height="16"/>
      <rect x="100" y="4" width="16" height="16"/>
      <rect x="116" y="4" width="16" height="16"/>
      
      <rect x="4" y="20" width="16" height="16"/>
      <rect x="116" y="20" width="16" height="16"/>
      <rect x="4" y="36" width="16" height="16"/>
      <rect x="116" y="36" width="16" height="16"/>
      <rect x="4" y="52" width="16" height="16"/>
      <rect x="116" y="52" width="16" height="16"/>
      <rect x="4" y="68" width="16" height="16"/>
      <rect x="116" y="68" width="16" height="16"/>
      <rect x="4" y="84" width="16" height="16"/>
      <rect x="116" y="84" width="16" height="16"/>
      <rect x="4" y="100" width="16" height="16"/>
      <rect x="116" y="100" width="16" height="16"/>
      
      <rect x="4" y="116" width="16" height="16"/>
      <rect x="20" y="116" width="16" height="16"/>
      <rect x="36" y="116" width="16" height="16"/>
      <rect x="52" y="116" width="16" height="16"/>
      <rect x="68" y="116" width="16" height="16"/>
      <rect x="84" y="116" width="16" height="16"/>
      <rect x="100" y="116" width="16" height="16"/>
      <rect x="116" y="116" width="16" height="16"/>
    </g>
    
    <!-- 墙壁纹理 -->
    <g fill="rgba(255,255,255,0.1)">
      <rect x="6" y="6" width="12" height="12"/>
      <rect x="22" y="6" width="12" height="12"/>
      <rect x="38" y="6" width="12" height="12"/>
      <rect x="54" y="6" width="12" height="12"/>
      <rect x="70" y="6" width="12" height="12"/>
      <rect x="86" y="6" width="12" height="12"/>
      <rect x="102" y="6" width="12" height="12"/>
      <rect x="118" y="6" width="12" height="12"/>
    </g>
    
    <!-- 目标点 -->
    <g>
      <circle cx="60" cy="60" r="6" fill="rgba(255,215,0,0.3)" stroke="#FFD700" stroke-width="2"/>
      <text x="60" y="65" font-family="Arial, sans-serif" font-size="8" fill="#FFD700" text-anchor="middle">🎯</text>
      
      <circle cx="76" cy="76" r="6" fill="rgba(255,215,0,0.3)" stroke="#FFD700" stroke-width="2"/>
      <text x="76" y="81" font-family="Arial, sans-serif" font-size="8" fill="#FFD700" text-anchor="middle">🎯</text>
    </g>
    
    <!-- 箱子 -->
    <g>
      <!-- 普通箱子 -->
      <rect x="52" y="52" width="16" height="16" fill="url(#boxGradient)" rx="2" stroke="#A0522D" stroke-width="1"/>
      <text x="60" y="62" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">📦</text>
      
      <!-- 完成的箱子（在目标点上） -->
      <rect x="68" y="68" width="16" height="16" fill="url(#completedBoxGradient)" rx="2" stroke="#228B22" stroke-width="1"/>
      <text x="76" y="78" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">✅</text>
    </g>
    
    <!-- 玩家 -->
    <g>
      <circle cx="44" cy="44" r="8" fill="rgba(33,150,243,0.3)" stroke="#2196F3" stroke-width="2"/>
      <text x="44" y="48" font-family="Arial, sans-serif" font-size="12" fill="#2196F3" text-anchor="middle">🤖</text>
    </g>
    
    <!-- 移动箭头提示 -->
    <g opacity="0.6">
      <path d="M 44 28 L 48 32 L 44 36 L 40 32 Z" fill="#FFD700"/>
      <text x="44" y="24" font-family="Arial, sans-serif" font-size="8" fill="#FFD700" text-anchor="middle">推</text>
    </g>
  </g>
  
  <!-- 游戏统计 -->
  <g transform="translate(20, 160)" opacity="0.9">
    <rect x="0" y="0" width="160" height="25" fill="rgba(0,0,0,0.7)" rx="12"/>
    <text x="20" y="17" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFD700">步数: 15</text>
    <text x="80" y="17" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#FFD700">推箱: 8</text>
    <text x="130" y="17" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#32CD32">1/2</text>
  </g>
  
  <!-- 装饰性元素 -->
  <g opacity="0.3">
    <!-- 左上角装饰 -->
    <rect x="25" y="25" width="6" height="6" fill="rgba(255,255,255,0.5)" rx="1"/>
    <rect x="33" y="25" width="4" height="4" fill="rgba(255,255,255,0.3)" rx="1"/>
    
    <!-- 右下角装饰 -->
    <rect x="169" y="169" width="6" height="6" fill="rgba(255,255,255,0.5)" rx="1"/>
    <rect x="163" y="175" width="4" height="4" fill="rgba(255,255,255,0.3)" rx="1"/>
  </g>
  
  <!-- 底部装饰线 -->
  <rect x="20" y="190" width="160" height="2" fill="rgba(255,255,255,0.3)" rx="1"/>
</svg>