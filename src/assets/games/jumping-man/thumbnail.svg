<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景天空 -->
  <rect width="200" height="150" fill="#87CEEB"/>
  
  <!-- 云朵 -->
  <g fill="#FFF" opacity="0.8">
    <circle cx="40" cy="30" r="12"/>
    <circle cx="55" cy="30" r="15"/>
    <circle cx="70" cy="30" r="12"/>
    <circle cx="50" cy="20" r="10"/>
    <circle cx="60" cy="20" r="10"/>
    
    <circle cx="140" cy="25" r="10"/>
    <circle cx="152" cy="25" r="12"/>
    <circle cx="164" cy="25" r="10"/>
    <circle cx="152" cy="17" r="8"/>
  </g>
  
  <!-- 地面 -->
  <rect x="0" y="120" width="200" height="30" fill="#8B4513"/>
  <rect x="0" y="120" width="200" height="5" fill="#228B22"/>
  
  <!-- 跳跃的小人 -->
  <g transform="translate(60, 80)">
    <!-- 身体 -->
    <rect x="15" y="20" width="20" height="25" rx="3" fill="#4CAF50"/>
    
    <!-- 头部 -->
    <circle cx="25" cy="15" r="12" fill="#4CAF50"/>
    
    <!-- 眼睛 -->
    <circle cx="21" cy="12" r="2" fill="#000"/>
    <circle cx="29" cy="12" r="2" fill="#000"/>
    
    <!-- 嘴巴 -->
    <path d="M 20 18 Q 25 22 30 18" stroke="#000" stroke-width="1.5" fill="none"/>
    
    <!-- 手臂 (跳跃姿势) -->
    <rect x="8" y="25" width="12" height="4" rx="2" fill="#4CAF50" transform="rotate(-30 14 27)"/>
    <rect x="30" y="25" width="12" height="4" rx="2" fill="#4CAF50" transform="rotate(30 36 27)"/>
    
    <!-- 腿部 (跳跃姿势) -->
    <rect x="12" y="42" width="6" height="15" rx="3" fill="#4CAF50" transform="rotate(-20 15 49)"/>
    <rect x="32" y="42" width="6" height="15" rx="3" fill="#4CAF50" transform="rotate(20 35 49)"/>
  </g>
  
  <!-- 障碍物 -->
  <rect x="130" y="95" width="15" height="25" fill="#F44336"/>
  <rect x="170" y="85" width="15" height="35" fill="#F44336"/>
  
  <!-- 金币 -->
  <g>
    <circle cx="110" cy="70" r="8" fill="#FFD700"/>
    <circle cx="107" cy="67" r="2" fill="#FFF"/>
    
    <circle cx="150" cy="60" r="8" fill="#FFD700"/>
    <circle cx="147" cy="57" r="2" fill="#FFF"/>
  </g>
  
  <!-- 运动线条表示跳跃 -->
  <g stroke="#FFF" stroke-width="2" opacity="0.6" fill="none">
    <path d="M 45 95 Q 55 85 65 95"/>
    <path d="M 50 100 Q 60 90 70 100"/>
    <path d="M 55 105 Q 65 95 75 105"/>
  </g>
  
  <!-- 游戏标题 -->
  <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">跳跃小人</text>
</svg>