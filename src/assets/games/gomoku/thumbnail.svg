<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="boardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DEB887;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D2B48C;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="blackPiece" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#666;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="whitePiece" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ddd;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="200" height="200" fill="url(#bgGradient)" rx="20"/>
  
  <!-- 游戏标题区域 -->
  <rect x="20" y="20" width="160" height="40" fill="rgba(255,255,255,0.2)" rx="10" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  
  <!-- 五子棋图标 -->
  <circle cx="45" cy="40" r="8" fill="url(#blackPiece)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="65" cy="40" r="8" fill="url(#whitePiece)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
  
  <!-- 标题文字 -->
  <text x="85" y="35" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">五子棋</text>
  <text x="85" y="48" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.8)">GOMOKU</text>
  
  <!-- 模式显示 -->
  <rect x="120" y="28" width="50" height="24" fill="rgba(0,0,0,0.3)" rx="4"/>
  <text x="145" y="42" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#00ff00" text-anchor="middle">AI对战</text>
  
  <!-- 棋盘 -->
  <g transform="translate(30, 80)">
    <!-- 棋盘背景 -->
    <rect x="0" y="0" width="140" height="140" fill="url(#boardGradient)" rx="8" stroke="#8B4513" stroke-width="2"/>
    
    <!-- 棋盘网格线 -->
    <!-- 垂直线 -->
    <g stroke="#8B4513" stroke-width="1" opacity="0.8">
      <line x1="15" y1="15" x2="15" y2="125"/>
      <line x1="25" y1="15" x2="25" y2="125"/>
      <line x1="35" y1="15" x2="35" y2="125"/>
      <line x1="45" y1="15" x2="45" y2="125"/>
      <line x1="55" y1="15" x2="55" y2="125"/>
      <line x1="65" y1="15" x2="65" y2="125"/>
      <line x1="75" y1="15" x2="75" y2="125"/>
      <line x1="85" y1="15" x2="85" y2="125"/>
      <line x1="95" y1="15" x2="95" y2="125"/>
      <line x1="105" y1="15" x2="105" y2="125"/>
      <line x1="115" y1="15" x2="115" y2="125"/>
      <line x1="125" y1="15" x2="125" y2="125"/>
    </g>
    
    <!-- 水平线 -->
    <g stroke="#8B4513" stroke-width="1" opacity="0.8">
      <line x1="15" y1="15" x2="125" y2="15"/>
      <line x1="15" y1="25" x2="125" y2="25"/>
      <line x1="15" y1="35" x2="125" y2="35"/>
      <line x1="15" y1="45" x2="125" y2="45"/>
      <line x1="15" y1="55" x2="125" y2="55"/>
      <line x1="15" y1="65" x2="125" y2="65"/>
      <line x1="15" y1="75" x2="125" y2="75"/>
      <line x1="15" y1="85" x2="125" y2="85"/>
      <line x1="15" y1="95" x2="125" y2="95"/>
      <line x1="15" y1="105" x2="125" y2="105"/>
      <line x1="15" y1="115" x2="125" y2="115"/>
      <line x1="15" y1="125" x2="125" y2="125"/>
    </g>
    
    <!-- 天元点 -->
    <circle cx="70" cy="70" r="2" fill="#8B4513"/>
    
    <!-- 星位点 -->
    <circle cx="45" cy="45" r="1.5" fill="#8B4513"/>
    <circle cx="95" cy="45" r="1.5" fill="#8B4513"/>
    <circle cx="45" cy="95" r="1.5" fill="#8B4513"/>
    <circle cx="95" cy="95" r="1.5" fill="#8B4513"/>
    
    <!-- 示例棋局 - 展示五子连珠 -->
    <!-- 黑棋连珠 -->
    <circle cx="45" cy="65" r="6" fill="url(#blackPiece)" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
    <circle cx="55" cy="65" r="6" fill="url(#blackPiece)" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
    <circle cx="65" cy="65" r="6" fill="url(#blackPiece)" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
    <circle cx="75" cy="65" r="6" fill="url(#blackPiece)" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
    <circle cx="85" cy="65" r="6" fill="url(#blackPiece)" stroke="rgba(0,0,0,0.3)" stroke-width="1"/>
    
    <!-- 最后一颗棋子高亮 -->
    <circle cx="85" cy="65" r="8" fill="none" stroke="#FFD700" stroke-width="2" opacity="0.8"/>
    
    <!-- 白棋 -->
    <circle cx="35" cy="55" r="6" fill="url(#whitePiece)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <circle cx="45" cy="55" r="6" fill="url(#whitePiece)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <circle cx="55" cy="55" r="6" fill="url(#whitePiece)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <circle cx="65" cy="55" r="6" fill="url(#whitePiece)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    
    <circle cx="35" cy="75" r="6" fill="url(#whitePiece)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <circle cx="45" cy="75" r="6" fill="url(#whitePiece)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <circle cx="55" cy="75" r="6" fill="url(#whitePiece)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <circle cx="65" cy="75" r="6" fill="url(#whitePiece)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    
    <circle cx="25" cy="85" r="6" fill="url(#whitePiece)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <circle cx="35" cy="85" r="6" fill="url(#whitePiece)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <circle cx="75" cy="55" r="6" fill="url(#whitePiece)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
    <circle cx="85" cy="55" r="6" fill="url(#whitePiece)" stroke="rgba(0,0,0,0.2)" stroke-width="1"/>
  </g>
  
  <!-- 获胜标识 -->
  <g transform="translate(50, 160)" opacity="0.9">
    <rect x="0" y="0" width="100" height="25" fill="rgba(0,0,0,0.7)" rx="12"/>
    <text x="50" y="17" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFD700" text-anchor="middle">⚫ 黑棋获胜!</text>
  </g>
  
  <!-- 装饰性元素 -->
  <g opacity="0.3">
    <!-- 左上角装饰 -->
    <circle cx="25" cy="25" r="3" fill="rgba(255,255,255,0.5)"/>
    <circle cx="35" cy="25" r="2" fill="rgba(255,255,255,0.3)"/>
    
    <!-- 右下角装饰 -->
    <circle cx="175" cy="175" r="3" fill="rgba(255,255,255,0.5)"/>
    <circle cx="165" cy="175" r="2" fill="rgba(255,255,255,0.3)"/>
  </g>
  
  <!-- 底部装饰线 -->
  <rect x="20" y="190" width="160" height="2" fill="rgba(255,255,255,0.3)" rx="1"/>
</svg>