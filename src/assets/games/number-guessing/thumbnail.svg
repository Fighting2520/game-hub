<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <!-- 数字发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 问号动画 -->
    <animateTransform id="questionRotate" attributeName="transform" type="rotate" 
                      values="0 100 75;5 100 75;-5 100 75;0 100 75" dur="2s" repeatCount="indefinite"/>
  </defs>
  
  <rect width="200" height="150" fill="url(#bgGradient)"/>
  
  <!-- 主要游戏区域背景 -->
  <rect x="20" y="20" width="160" height="110" rx="15" fill="rgba(255, 255, 255, 0.1)" 
        stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
  
  <!-- 神秘数字显示区域 -->
  <rect x="30" y="30" width="140" height="40" rx="10" fill="rgba(255, 255, 255, 0.2)" 
        stroke="rgba(255, 215, 0, 0.5)" stroke-width="2"/>
  
  <!-- 问号表示神秘数字 -->
  <text x="100" y="55" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="24" font-weight="bold" fill="#FFD700" filter="url(#glow)">
    ? ? ?
    <animateTransform attributeName="transform" type="rotate" 
                      values="0 100 50;2 100 50;-2 100 50;0 100 50" dur="3s" repeatCount="indefinite"/>
  </text>
  
  <!-- 输入框模拟 -->
  <rect x="40" y="80" width="80" height="25" rx="5" fill="rgba(255, 255, 255, 0.8)" 
        stroke="rgba(255, 255, 255, 0.9)" stroke-width="1"/>
  <text x="80" y="97" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" fill="#333">输入猜测</text>
  
  <!-- 猜测按钮 -->
  <rect x="130" y="80" width="35" height="25" rx="5" fill="rgba(76, 175, 80, 0.8)" 
        stroke="rgba(76, 175, 80, 1)" stroke-width="1"/>
  <text x="147.5" y="97" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="12" font-weight="bold" fill="white">猜测</text>
  
  <!-- 提示区域 -->
  <rect x="30" y="115" width="140" height="20" rx="5" fill="rgba(255, 193, 7, 0.2)" 
        stroke="rgba(255, 193, 7, 0.5)" stroke-width="1"/>
  
  <!-- 提示文字 -->
  <text x="100" y="128" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="10" fill="#FFD700">💡 太大了！试试更小的数字</text>
  
  <!-- 左侧装饰数字 -->
  <g opacity="0.3">
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="16" fill="white">1</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="16" fill="white">7</text>
    <text x="15" y="85" font-family="Arial, sans-serif" font-size="16" fill="white">3</text>
    <text x="15" y="105" font-family="Arial, sans-serif" font-size="16" fill="white">9</text>
  </g>
  
  <!-- 右侧装饰数字 -->
  <g opacity="0.3">
    <text x="185" y="45" font-family="Arial, sans-serif" font-size="16" fill="white">2</text>
    <text x="185" y="65" font-family="Arial, sans-serif" font-size="16" fill="white">5</text>
    <text x="185" y="85" font-family="Arial, sans-serif" font-size="16" fill="white">8</text>
    <text x="185" y="105" font-family="Arial, sans-serif" font-size="16" fill="white">4</text>
  </g>
  
  <!-- 游戏统计信息 -->
  <g transform="translate(175, 25)">
    <!-- 剩余次数 -->
    <rect x="0" y="0" width="20" height="15" rx="3" fill="rgba(244, 67, 54, 0.3)"/>
    <text x="10" y="10" text-anchor="middle" font-family="Arial, sans-serif" 
          font-size="8" font-weight="bold" fill="white">8次</text>
    
    <!-- 得分 -->
    <rect x="0" y="20" width="20" height="15" rx="3" fill="rgba(76, 175, 80, 0.3)"/>
    <text x="10" y="30" text-anchor="middle" font-family="Arial, sans-serif" 
          font-size="8" font-weight="bold" fill="white">1250</text>
    
    <!-- 难度 -->
    <rect x="0" y="40" width="20" height="15" rx="3" fill="rgba(156, 39, 176, 0.3)"/>
    <text x="10" y="50" text-anchor="middle" font-family="Arial, sans-serif" 
          font-size="8" font-weight="bold" fill="white">中等</text>
  </g>
  
  <!-- 思考泡泡 -->
  <g transform="translate(45, 15)">
    <ellipse cx="0" cy="0" rx="8" ry="6" fill="rgba(255, 255, 255, 0.8)" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="-3" cy="8" rx="4" ry="3" fill="rgba(255, 255, 255, 0.8)" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="-6" cy="14" rx="2" ry="2" fill="rgba(255, 255, 255, 0.8)" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- 泡泡内的数字 -->
    <text x="0" y="3" text-anchor="middle" font-family="Arial, sans-serif" 
          font-size="8" fill="#333">42?</text>
  </g>
  
  <!-- 箭头指向输入框 -->
  <g transform="translate(80, 75)" opacity="0.6">
    <path d="M 0 0 L -5 -5 L -2 -5 L -2 -10 L 2 -10 L 2 -5 L 5 -5 Z" 
          fill="#FFD700">
      <animateTransform attributeName="transform" type="translate" 
                        values="0,0;0,-2;0,0" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- 星星装饰 -->
  <g opacity="0.8">
    <text x="25" y="25" font-family="Arial, sans-serif" font-size="12" fill="#FFD700">⭐</text>
    <text x="160" y="35" font-family="Arial, sans-serif" font-size="10" fill="#FFD700">✨</text>
    <text x="35" y="140" font-family="Arial, sans-serif" font-size="8" fill="#FFD700">💫</text>
    <text x="155" y="125" font-family="Arial, sans-serif" font-size="10" fill="#FFD700">⭐</text>
  </g>
  
  <!-- 游戏标题 -->
  <text x="100" y="145" text-anchor="middle" font-family="Arial, sans-serif" 
        font-size="14" font-weight="bold" fill="white">猜数字</text>
</svg>